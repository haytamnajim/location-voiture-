<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ANAS RENT CAR - Service de location de voitures de luxe et de prestige. Réservez votre véhicule d'exception au meilleur prix.">

    <!-- Google Fonts (FR + AR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Init theme before paint to prevent flash -->
    <script>
        (function () {
            const t = localStorage.getItem('arcTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
